<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="WiseGift monogram app icon">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4A2BD6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bgm)"/>
  <!-- W monogram, optically centred -->
  <polyline points="312,486 458,884 590,628 722,884 868,486"
            fill="none" stroke="#FFFFFF" stroke-width="112"
            stroke-linejoin="round" stroke-linecap="round"/>
  <!-- spark as the terminal flare of the right up-stroke (overlaps the tip) -->
  <polygon points="904,316 934,372 992,402 934,432 904,490 874,432 816,402 874,372" fill="#FFFFFF"/>
</svg>
